# Netlify: the Next.js adapter (OpenNext) is applied automatically and turns
# app/api/** route handlers into functions (60 s limit, same as maxDuration).
# Environment variables live in the Netlify UI / `netlify env:set`, never here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Functions run on the build's Node version. firebase-admin 14 (jwks-rsa →
  # jose 6) needs require() of ES modules, which failed on the Node 22 runtime
  # with ERR_REQUIRE_ESM; Node 24 matches local development.
  NODE_VERSION = "24"

# netlify/functions/reminders.mjs replaces the Vercel cron in vercel.json.
[functions]
  directory = "netlify/functions"
